name: Miri (Undefined Behavior Detection)

# TEMPORARILY DISABLED - Re-enable when CI infrastructure is stable
# Manual trigger only for now
on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Miri flags for stricter checking
  MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check

jobs:
  miri-unsafe-code:
    name: Test Unsafe Code for UB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Nightly with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-

      - name: Setup Miri
        run: cargo miri setup

      - name: Run Miri on Unsafe Data Structures
        run: |
          echo "🔍 Testing unsafe data structures for undefined behavior..."
          # Miri cannot execute io_uring syscalls, so this covers the unsafe
          # data structures that do not need a running reactor.
          cargo miri test --package glommio --lib channels::spsc_queue
          cargo miri test --package glommio --lib free_list
          echo "✅ No undefined behavior detected!"

      - name: Comment on PR (if Miri passes)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Miri Check Passed** - No undefined behavior detected in unsafe data structures!'
            })

  # Optional: Full library Miri check (manual only, takes several minutes)
  miri-full:
    name: Full Library UB Check
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust Nightly with Miri
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-miri-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-full-

      - name: Setup Miri
        run: cargo miri setup

      - name: Run Miri on Full Library
        run: |
          echo "🔍 Testing full library for undefined behavior..."
          echo "⚠️  This may take several minutes..."
          cargo miri test --package glommio --lib
          echo "✅ No undefined behavior detected in full library!"
