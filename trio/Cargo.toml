[package]
name = "bapps-trio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trio-shaped structured concurrency for Glommio thread-per-core applications"
license.workspace = true
keywords = ["glommio", "structured-concurrency", "trio", "io-uring"]
categories = ["asynchronous", "concurrency"]
publish = false

[lib]
name = "bapps_trio"
path = "src/lib.rs"

[dependencies]
# The runtime in core/ (package bapps-core), whose library keeps the name
# `glommio`, so application code uses `glommio::` paths.
glommio.workspace = true
futures-lite = "2.6"
task-local = "0.1.1"

[dev-dependencies]
