name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate and integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the toolchain (with clippy and rustfmt);
      # `rustup show` installs it.
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Download dependencies as the runner user, so the root steps below do
      # not leave root-owned files in ~/.cargo.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # io_uring needs locked memory, and raising the limit needs root, as in
      # core's upstream CI (core/.github/scripts/run-tests.sh).
      - name: make validate
        run: sudo -E env "PATH=$PATH" bash -c 'ulimit -Sl 512; ulimit -Hl 512; nproc; make validate'

      - name: make integration
        run: sudo -E env "PATH=$PATH" bash -c 'ulimit -Sl 512; ulimit -Hl 512; make integration'

      # cargo ran as root: give target/ and ~/.cargo back so the cache step
      # can read them, and drop trybuild's scratch directory (target/tests),
      # which the cache's cleaner mistakes for a nested target directory.
      - name: Prepare the cache
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo"
          rm -rf target/tests
